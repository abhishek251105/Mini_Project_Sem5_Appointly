
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Appointly Razorpay Test</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  <h2>Appointly - Razorpay Checkout Test</h2>

  <input id="key" placeholder="Razorpay Key ID" />
  <br /><br />

  <input id="order" placeholder="Razorpay Order ID" />
  <br /><br />

  <button onclick="startPayment()">Open Razorpay Checkout</button>

  <h3>Payment Response</h3>
  <pre id="result">Waiting for payment...</pre>

  <script>
    function startPayment() {
      const key = document.getElementById("key").value.trim();
      const orderId = document.getElementById("order").value.trim();

      if (!key || !orderId) {
        alert("Enter your Key ID and Order ID");
        return;
      }

      if (typeof Razorpay === "undefined") {
        alert("Razorpay Checkout script could not load");
        return;
      }

      const options = {
        key,
        order_id: orderId,
        name: "Appointly",
        description: "Appointment Payment Test",
        handler: function (response) {
          document.getElementById("result").textContent =
            JSON.stringify({
              razorpay_order_id: response.razorpay_order_id,
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_signature: response.razorpay_signature
            }, null, 2);
        },
        theme: {
          color: "#2563eb"
        }
      };

      const rzp = new Razorpay(options);
      rzp.open();
    }
  </script>
</body>
</html>
